<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { padding: 20px; border: 1px solid #51667c; border-radius: 14px; }
    label { display: block; margin: 12px 0 6px; }
    input { box-sizing: border-box; width: 100%; padding: 12px; background: #101a28; color: #ecf4ff; border: 1px solid #51667c; border-radius: 8px; font: inherit; }
    textarea { box-sizing: border-box; width: 100%; min-height: 110px; padding: 12px; background: #101a28; color: #ecf4ff; border: 1px solid #51667c; border-radius: 8px; font: inherit; resize: vertical; }
    button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font: inherit; cursor: pointer; }
    button.secondary { margin-left: 8px; background: #bfd0e5; }
    .note-actions button { margin: 12px 8px 0 0; }
    #note-editor[hidden] { display: none; }
    button:disabled { opacity: .5; cursor: wait; }
    #auth-message { color: #ffe3e8; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버 단일 경로 자료실</div>
    <h1>내 자료실</h1>
    <p>자료를 서버에서 불러옵니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">로그인한 계정으로 가상 자료를 조회합니다. 실습용 자료만 사용하세요.</div>
    <section class="auth" aria-labelledby="auth-heading">
      <h2 id="auth-heading">계정 로그인</h2>
      <p id="auth-status" role="status">로그인 상태를 확인하고 있습니다.</p>
      <form id="login-form" hidden>
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="username" required maxlength="254">
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit" disabled>로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p id="auth-message" role="alert"></p>
    </section>
    <section id="note-editor" class="auth" hidden aria-labelledby="note-heading">
      <h2 id="note-heading">메모 추가</h2>
      <form id="note-form">
        <input id="note-id" type="hidden">
        <label for="note-title">제목</label>
        <input id="note-title" maxlength="120" required>
        <label for="note-body">내용</label>
        <textarea id="note-body" maxlength="5000" required></textarea>
        <button id="note-save" type="submit">저장</button>
        <button id="note-cancel" class="secondary" type="button">취소</button>
      </form>
      <p id="note-message" role="alert"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>로그인하면 자료를 불러옵니다.</li></ul>
  </main>
  <script type="module">
    const form = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const status = document.querySelector('#auth-status');
    const message = document.querySelector('#auth-message');
    const password = document.querySelector('#password');
    const list = document.querySelector('#notes');
    const editor = document.querySelector('#note-editor');
    const noteForm = document.querySelector('#note-form');
    const noteId = document.querySelector('#note-id');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteHeading = document.querySelector('#note-heading');
    const noteMessage = document.querySelector('#note-message');
    let loadVersion = 0;
    let currentSession = null;
    const show = text => { const li = document.createElement('li'); li.textContent = text; list.replaceChildren(li); };
    function clearEditor() {
      noteForm.reset();
      noteId.value = '';
      noteHeading.textContent = '메모 추가';
      noteMessage.textContent = '';
    }
    function editNote(note) {
      noteId.value = note.id;
      noteTitle.value = note.title;
      noteBody.value = note.body;
      noteHeading.textContent = '메모 수정';
      noteMessage.textContent = '';
      editor.scrollIntoView({ behavior: 'smooth', block: 'center' });
      noteTitle.focus();
    }
    async function api(path, options = {}) {
      if (!currentSession?.access_token) throw new Error('LOGIN_REQUIRED');
      const response = await fetch(path, {
        cache: 'no-store', ...options,
        headers: { Authorization: 'Bearer ' + currentSession.access_token, ...(options.headers ?? {}) },
      });
      if (response.status === 401) throw new Error('LOGIN_REQUIRED');
      if (!response.ok && response.status !== 204) throw new Error('REQUEST_FAILED');
      return response.status === 204 ? null : response.json();
    }
    function renderNotes(notes) {
      if (notes.length === 0) { show('내 메모가 없습니다. 위에서 첫 메모를 추가해 주세요.'); return; }
      list.replaceChildren(...notes.map(note => {
        const li = document.createElement('li');
        const title = document.createElement('strong');
        const content = document.createElement('span');
        const actions = document.createElement('div');
        const edit = document.createElement('button');
        const remove = document.createElement('button');
        title.textContent = note.title; content.textContent = note.body;
        actions.className = 'note-actions'; edit.type = remove.type = 'button';
        edit.textContent = '수정'; remove.textContent = '삭제'; remove.className = 'secondary';
        edit.addEventListener('click', () => editNote(note));
        remove.addEventListener('click', async () => {
          if (!confirm('이 메모를 삭제할까요?')) return;
          try { await api('/api/notes/' + encodeURIComponent(note.id), { method: 'DELETE' }); await loadNotes(currentSession); }
          catch (error) { noteMessage.textContent = error.message === 'LOGIN_REQUIRED' ? '로그인을 다시 확인해 주세요.' : '삭제에 실패했습니다.'; }
        });
        actions.append(edit, remove); li.append(title, content, actions); return li;
      }));
    }
    async function loadNotes(session) {
      const version = ++loadVersion;
      list.replaceChildren();
      if (!session?.access_token) { show('로그인하면 자료를 불러옵니다.'); return; }
      show('자료를 불러오는 중입니다.');
      try {
        const data = await api('/api/notes');
        if (version !== loadVersion) return;
        if (!Array.isArray(data)) throw new Error('REQUEST_FAILED');
        renderNotes(data);
      } catch (error) {
        if (version === loadVersion) show(error.message === 'LOGIN_REQUIRED' ? '로그인 확인에 실패했습니다. 다시 로그인해 주세요.' : '자료를 불러오지 못했습니다. 연결을 확인해 주세요.');
      }
    }
    function renderSession(session) {
      const signedIn = Boolean(session?.user);
      currentSession = session;
      form.hidden = signedIn;
      logoutButton.hidden = !signedIn;
      editor.hidden = !signedIn;
      status.textContent = signedIn ? '로그인되었습니다.' : '로그아웃 상태입니다.';
      password.value = '';
      void loadNotes(session);
    }
    function errorMessage(error) {
      const reasons = {
        invalid_credentials: '이메일 또는 비밀번호가 올바르지 않습니다.',
        email_not_confirmed: '이메일 인증을 완료한 뒤 로그인해 주세요.',
        over_request_rate_limit: '요청이 많습니다. 잠시 후 다시 시도해 주세요.',
        user_banned: '사용이 제한된 계정입니다.',
      };
      return reasons[error?.code] || '인증 요청에 실패했습니다. 네트워크 연결과 계정 상태를 확인해 주세요.';
    }
    try {
      const authResponse = await fetch('/api/auth-config', { cache: 'no-store' });
      if (!authResponse.ok) throw new Error('AUTH_CONFIGURATION_UNAVAILABLE');
      const authConfig = await authResponse.json();
      if (!authConfig || typeof authConfig.url !== 'string'
          || typeof authConfig.publishableKey !== 'string') throw new Error('AUTH_CONFIGURATION_INVALID');
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.117.2');
      const client = createClient(authConfig.url, authConfig.publishableKey);
      // SDK manages credentials and session tokens. Never print them.
      client.auth.onAuthStateChange((_event, session) => renderSession(session));
      const { data, error } = await client.auth.getSession();
      if (error) throw error;
      renderSession(data.session);
      loginButton.disabled = false;
      noteForm.addEventListener('submit', async event => {
        event.preventDefault();
        const editing = Boolean(noteId.value);
        const save = document.querySelector('#note-save');
        save.disabled = true; noteMessage.textContent = '';
        try {
          await api(editing ? '/api/notes/' + encodeURIComponent(noteId.value) : '/api/notes', {
            method: editing ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: noteTitle.value, body: noteBody.value }),
          });
          clearEditor();
          await loadNotes(currentSession);
        } catch (error) {
          noteMessage.textContent = error.message === 'LOGIN_REQUIRED' ? '로그인을 다시 확인해 주세요.' : '저장에 실패했습니다. 제목과 내용을 확인해 주세요.';
        } finally { save.disabled = false; }
      });
      document.querySelector('#note-cancel').addEventListener('click', clearEditor);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        loginButton.disabled = true;
        message.textContent = '';
        try {
          const { data, error } = await client.auth.signInWithPassword({
            email: document.querySelector('#email').value.trim(), password: password.value,
          });
          if (error) message.textContent = errorMessage(error);
          else renderSession(data.session);
        } catch {
          message.textContent = '로그인에 실패했습니다. 연결을 확인하고 다시 시도해 주세요.';
        } finally {
          password.value = '';
          loginButton.disabled = false;
        }
      });
      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;
        message.textContent = '';
        try {
          const { error } = await client.auth.signOut({ scope: 'local' });
          if (error) message.textContent = errorMessage(error);
          else renderSession(null);
        } catch {
          message.textContent = '로그아웃에 실패했습니다. 연결을 확인하고 다시 시도해 주세요.';
        } finally {
          logoutButton.disabled = false;
        }
      });
    } catch {
      status.textContent = '로그인 기능을 불러오지 못했습니다.';
      message.textContent = '네트워크 연결을 확인한 뒤 새로고침해 주세요.';
    }
  </script>

</body>
</html>
