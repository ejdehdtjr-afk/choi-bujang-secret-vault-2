<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { padding: 20px; border: 1px solid #51667c; border-radius: 14px; }
    label { display: block; margin: 12px 0 6px; }
    input { box-sizing: border-box; width: 100%; padding: 12px; background: #101a28; color: #ecf4ff; border: 1px solid #51667c; border-radius: 8px; font: inherit; }
    button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #auth-message { color: #ffe3e8; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인 자료실</div>
    <h1>내 자료실</h1>
    <p>자료를 서버에서 불러옵니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">로그인한 계정으로 가상 자료를 조회합니다. 실습용 자료만 사용하세요.</div>
    <section class="auth" aria-labelledby="auth-heading">
      <h2 id="auth-heading">계정 로그인</h2>
      <p id="auth-status" role="status">로그인 상태를 확인하고 있습니다.</p>
      <form id="login-form" hidden>
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="username" required maxlength="254">
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit" disabled>로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p id="auth-message" role="alert"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>로그인하면 자료를 불러옵니다.</li></ul>
  </main>
  <script type="module">
    const form = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const status = document.querySelector('#auth-status');
    const message = document.querySelector('#auth-message');
    const password = document.querySelector('#password');
    const list = document.querySelector('#notes');
    let loadVersion = 0;
    async function loadNotes(session) {
      const version = ++loadVersion;
      list.replaceChildren();
      const show = text => { const li = document.createElement('li'); li.textContent = text; list.replaceChildren(li); };
      if (!session?.access_token) { show('로그인하면 자료를 불러옵니다.'); return; }
      show('자료를 불러오는 중입니다.');
      try {
        const response = await fetch('/api/notes', {
          cache: 'no-store', headers: { Authorization: 'Bearer ' + session.access_token },
        });
        if (version !== loadVersion) return;
        if (response.status === 401) { show('로그인 확인에 실패했습니다. 다시 로그인해 주세요.'); return; }
        if (!response.ok) throw new Error('자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
        const data = await response.json();
        if (version !== loadVersion) return;
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        list.replaceChildren(...data.notes.map(note => {
          const li = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title; content.textContent = note.content;
          li.append(title, content); return li;
        }));
      } catch {
        if (version === loadVersion) show('자료를 불러오지 못했습니다. 연결을 확인해 주세요.');
      }
    }
    function renderSession(session) {
      const signedIn = Boolean(session?.user);
      form.hidden = signedIn;
      logoutButton.hidden = !signedIn;
      status.textContent = signedIn ? '로그인되었습니다.' : '로그아웃 상태입니다.';
      password.value = '';
      void loadNotes(session);
    }
    function errorMessage(error) {
      const reasons = {
        invalid_credentials: '이메일 또는 비밀번호가 올바르지 않습니다.',
        email_not_confirmed: '이메일 인증을 완료한 뒤 로그인해 주세요.',
        over_request_rate_limit: '요청이 많습니다. 잠시 후 다시 시도해 주세요.',
        user_banned: '사용이 제한된 계정입니다.',
      };
      return reasons[error?.code] || '인증 요청에 실패했습니다. 네트워크 연결과 계정 상태를 확인해 주세요.';
    }
    try {
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.117.2');
      const client = createClient('https://ucuwpmimzmweehoscibe.supabase.co',
        'sb_publishable_byQMUJmMnExVa7k-D9c1dA_WIO_YW0b');
      // SDK manages credentials and session tokens. Never print them.
      client.auth.onAuthStateChange((_event, session) => renderSession(session));
      const { data, error } = await client.auth.getSession();
      if (error) throw error;
      renderSession(data.session);
      loginButton.disabled = false;
      form.addEventListener('submit', async event => {
        event.preventDefault();
        loginButton.disabled = true;
        message.textContent = '';
        try {
          const { data, error } = await client.auth.signInWithPassword({
            email: document.querySelector('#email').value.trim(), password: password.value,
          });
          if (error) message.textContent = errorMessage(error);
          else renderSession(data.session);
        } catch {
          message.textContent = '로그인에 실패했습니다. 연결을 확인하고 다시 시도해 주세요.';
        } finally {
          password.value = '';
          loginButton.disabled = false;
        }
      });
      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;
        message.textContent = '';
        try {
          const { error } = await client.auth.signOut({ scope: 'local' });
          if (error) message.textContent = errorMessage(error);
          else renderSession(null);
        } catch {
          message.textContent = '로그아웃에 실패했습니다. 연결을 확인하고 다시 시도해 주세요.';
        } finally {
          logoutButton.disabled = false;
        }
      });
    } catch {
      status.textContent = '로그인 기능을 불러오지 못했습니다.';
      message.textContent = '네트워크 연결을 확인한 뒤 새로고침해 주세요.';
    }
  </script>

</body>
</html>
